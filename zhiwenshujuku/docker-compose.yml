version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "python -m uvicorn backend.api:app --host 0.0.0.0 --port 8765"

  frontend:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - ZHIWEN_API_URL=http://backend:8765
    depends_on:
      - backend
    command: >
      sh -c "streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0"
